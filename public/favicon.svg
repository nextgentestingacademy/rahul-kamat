<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas (fits dark & light browser chrome) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="16" />

  <!-- Subtle border highlight -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#3b82f6" stroke-width="8" stroke-opacity="0.45" />

  <!-- Monogram RK -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="230" letter-spacing="-6" text-anchor="middle">
    <text x="256" y="325" fill="url(#textGrad)">RK</text>
  </g>

  <!-- Technology / Academic accent underline -->
  <rect x="176" y="360" width="160" height="14" rx="7" fill="#38bdf8" opacity="0.9" />
</svg>